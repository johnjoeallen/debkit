# DebKit v2 sample configuration.
#
# Lives at ~/.config/debkit/config.yaml (shared defaults), with optional per-host
# overrides at ~/.config/debkit/hosts/<hostname>.yaml deep-merged on top -- a host
# file only needs to declare what differs for that host. Every field has an in-code
# default, so a sparse file is completely fine.
#
# This file shows every section with every field set to its real default value,
# annotated with the available options and which one suits most hosts. It's a
# schema reference and a safe starting point to copy and adjust -- not a
# transcript of any particular machine's state. For realistic configs tailored to
# specific situations (a NIS master/slave pair, a roaming laptop with Tailscale),
# see the Example Configs chapter in the docs instead.
#
# Sections with a `plan()` that can propose real changes (sudo_nopass, nis,
# wake_on_lan, git, apt, pam, network_interfaces, dns, hardware_reboot,
# hardware_sleep, hardware_rgb) only act when that section's gate field is truthy
# (usually `enabled: true` -- pam gates on `create_home_on_first_login` instead, and
# network_interfaces has no gate at all since an empty `links` list is already a
# no-op). Purely-diagnostic modules -- network.dhcp, network.firewall, systemd.units,
# identity.nss, core.inspect, developer.git's read side -- have no config section at
# all and always run read-only regardless of this file. See the Module Reference in
# the docs for the full discover()/diagnose()/plan() scope of each one.
#
# Try any section with:
#   debkit inspect   <module>   # discover() only
#   debkit diagnose  <module>   # discover() + compare against this file
#   debkit plan      <module>   # dry-run of what apply() would do
#   debkit apply     <module>   # apply + verify, with automatic rollback on failure
#   debkit verify    <module>   # functional checks only, e.g. after a reboot

debkit:
  host:
    # Usually left unset -- auto-detected from `hostname` at load time and used to
    # pick which hosts/<name>.yaml overlay to merge. Only set this if you need to
    # force a specific value.
    name: devbox

  # ------------------------------------------------------------------
  # Legacy installer targets (install::*) -- plain idempotent installers,
  # not part of the discover/diagnose/plan/apply/verify lifecycle. See the
  # Installers chapter in the docs for what each target actually does.
  # ------------------------------------------------------------------

  wallpapers:
    # Folder Variety rotates wallpapers from, e.g. "/home/<user>/Pictures/Wallpapers".
    # Empty (the default) means unset -- `debkit install variety` will warn if the
    # folder doesn't exist.
    folder: ""

  variety:
    # Rotation interval in minutes. Must be greater than 0 (validated). Default: 10.
    interval_minutes: 10

  foundation:
    # Targets `debkit install foundation` runs, in order. Recognized names (plus
    # aliases like `base`/`wol`) are documented in Installers > Foundation. Shown
    # here is the built-in default list.
    install: [essentials, git, rust, npm, codex, variety, nis, wake-on-lan]

  essentials:
    # apt packages `debkit install essentials` ensures are present (only runs
    # `apt-get update` if something's actually missing). Shown here is the
    # built-in default list -- ripgrep is one of them, not a separate
    # foundation.install entry. An empty or unset list falls back to these
    # defaults rather than installing nothing; leave `essentials` out of
    # `foundation.install` instead if you want to skip it entirely.
    packages:
      [curl, wget, zip, unzip, rsync, ca-certificates, gnupg, apt-transport-https, neovim, ripgrep]

  npm:
    # Node.js version `debkit install npm`/`codex` installs from the official
    # upstream binary tarballs (not apt, not nvm) into a per-user managed
    # directory. "latest" (the default) or an explicit version string; must not
    # be empty (validated). Installing a different version doesn't remove the
    # old one, but does switch which one a `current` symlink -- and therefore
    # PATH -- points at.
    version: latest

  # ------------------------------------------------------------------
  # Lifecycle modules -- see the Module Reference chapter in the docs for
  # each module's discover()/diagnose()/plan()/verify() behavior. Every gate
  # below (usually `enabled`) defaults to false; wake_on_lan is the one
  # exception, defaulting to true.
  # ------------------------------------------------------------------

  sudo_nopass:
    # Passwordless sudo is opt-in.
    enabled: false
    # Local group name the NOPASSWD sudoers drop-in applies to. Must not be
    # empty (validated). The standard %sudo rule is added if missing, never
    # removed. Default: "superuser".
    group: superuser
    # Automatically add the invoking user to `group` (skipped if `nis_managed`).
    # Default: true.
    add_current_user: true
    # Additional usernames to add to `group`, beyond the current user.
    users: []
    # true if this group's membership is managed via NIS netgroups instead of
    # local /etc/group -- skips the local group-creation step; this module then
    # only validates that NSS/sudo policy report the expected no-password
    # access. Default: false.
    nis_managed: false

  nis:
    # NIS is a homelab/office-LAN feature -- most hosts leave this disabled.
    enabled: false
    # master | slave | client. Default: "slave" -- recommended for normal
    # machines (keeps shared accounts available if the master is briefly
    # unreachable, once local maps are initialized). client is for machines
    # that don't need offline account availability; master is the one NIS
    # server host in a topology.
    role: slave
    # Required (non-empty) when enabled. No default -- e.g. "example.lan".
    domain: ""
    # Defaults to $SUDO_USER or $USER if left blank; required (non-empty) when
    # enabled (validated).
    admin_user: ""
    # Local groups checked for NIS/local admin-membership consistency, e.g.
    # [sudo]. Empty by default.
    local_admin_groups: []
    # Required when role: slave (validated). e.g. "nis-master.example.lan".
    master: ""
    # Required when role: client and `servers` is empty (validated).
    server: ""
    # slave only: prefer the local ypserv (127.0.0.1) over the master once
    # local maps exist -- never applied before local maps are actually
    # initialized, to avoid the classic "slave prefers itself before it has
    # any data" failure. Default: true.
    prefer_local: true
    # master only: push the rebuilt map set to `slaves` via yppush. Default: false.
    push_to_slaves: false
    # slave only: force a direct ypxfr pull instead of the normal ypinit -s
    # path. Default: false.
    force_refresh_maps: false
    # master only: FQDNs written into /var/yp/ypservers.
    slaves: []
    # client only, alternative to `server`: a list of candidate NIS servers.
    servers: []

  wake_on_lan:
    # The one module that defaults to true -- Wake-on-LAN is treated as an
    # opt-out, not opt-in, feature.
    enabled: true
    # "auto" (autodetect wired interfaces, the default) or an explicit list:
    # [enp5s0].
    interfaces: auto
    # Only "magic" is currently supported (validated).
    mode: magic
    # network_manager | ethtool | auto. Default: "network_manager", which suits
    # most modern Debian desktops. "auto" tries NetworkManager first when
    # available/managing the interface with an active profile, otherwise falls
    # back to ethtool via a debkit-wol@<interface>.service unit; "ethtool"
    # forces that path directly.
    backend: network_manager
    # Hostname recorded in the wake-info evidence written after apply. Defaults
    # to the current hostname if left blank.
    reference_host: ""

  git:
    enabled: false
    # store | cache | none | an explicit `credential.helper` command string.
    # Default: "store" (persists to credential_store_file, plaintext) -- "cache"
    # is safer but times out; "none" manages nothing, diagnose only. Must not be
    # empty when enabled (validated). Only the invoking user's global scope
    # (~/.gitconfig or ~/.config/git/config) is managed -- system or per-repo
    # scope is flagged but left alone.
    credential_helper: store
    # Only consulted when credential_helper: store. Empty (the default) means
    # git's own default (~/.git-credentials). Checked for 0600 permissions.
    credential_store_file: ""

  apt:
    # apt-cacher-ng proxying is opt-in -- most hosts don't run one.
    enabled: false
    # e.g. "http://<proxy-host>:3142". Empty (the default) means no proxy is
    # declared/managed.
    proxy: ""
    # Hosts that bypass `proxy` via a per-host DIRECT override -- repos with
    # their own CDN that shouldn't go through the cache, e.g. pkg.tailscale.com.
    direct_hosts: []

  pam:
    # The gate for this module -- there's no separate `enabled` field. Default: false.
    create_home_on_first_login: false
    # Which /etc/pam.d/<service> files get a pam_mkhomedir.so line appended.
    # Services whose PAM file doesn't exist on this host are skipped, not an
    # error. Default: [login, sshd].
    services: [login, sshd]
    # Rendered into the appended line as `skel=<skeleton>`. Default: "/etc/skel".
    skeleton: /etc/skel
    # Rendered into the appended line as `umask=<umask>`, giving the final line:
    # `session optional pam_mkhomedir.so umask=<umask> skel=<skeleton>`
    # Default: "0022".
    umask: "0022"

  network_interfaces:
    # Zero or more MAC -> stable-name declarations, e.g.:
    #   links:
    #     - mac: "aa:bb:cc:dd:ee:ff"
    #       name: lan0
    # Each entry renders a /etc/systemd/network/10-debkit-<name>.link file;
    # takes effect on next boot/udev reload, never live. No gate field -- an
    # empty list (the default) is naturally a no-op.
    links: []

  tailscale:
    enabled: false
    # Both informational only -- surfaced in the Observation as context, never
    # enforced (mapping this onto `tailscale set --accept-dns=...` isn't
    # something this module can confidently automate without a live install to
    # validate against). Both default to false.
    magic_dns_off_lan: false
    preserve_lan_dns: false

  dns:
    enabled: false
    # Only "dnsmasq" is declaratively managed today. Empty (the default) or any
    # other value means "diagnose only, never touch anything."
    provider: ""
    # Rendered as `local=/<domain>/` + `domain=<domain>` per entry -- an
    # authoritative local zone, so lookups for it never leak upstream and come
    # back NXDOMAIN. e.g. ["example.lan"].
    local_domains: []
    # Rendered as `listen-address=<a>,<b>,...`. e.g. ["127.0.0.1", "10.0.0.1"].
    listen: []
    # e.g. a local dnscrypt-proxy/similar, "127.0.0.1:5053". Empty (the
    # default) means none declared. Rendered as `server=<address>`.
    encrypted_upstream_address: ""

  hardware_reboot:
    # This whole module is diagnostic-only: plan()/apply() never do anything for
    # it, for either field below -- no grub/bootloader changes, no automated fix
    # of any kind. It only ever surfaces a diagnose() finding for a human to act
    # on (reseat a DIMM, adjust a BIOS setting, decide whether to flash).
    enabled: false
    # Set to your actual installed RAM, in GiB, rounded to the nearest common
    # size (8, 16, 32, 64, 96, 128, ...). 0 (the default) means "not declared,
    # don't check." Compared against /proc/meminfo's MemTotal (also rounded up)
    # -- a coarse, root-free, no-dmidecode capacity check that catches a DIMM
    # going undetected after a reboot/BIOS change. Not a speed check (EXPO/XMP
    # reverting to JEDEC needs `dmidecode --type 17` and root, out of scope).
    expected_memory_gib: 0
    # Known-affected BIOS versions are NOT configured here -- the registry ships
    # empty by design and lives instead at ~/.config/debkit/boards/registry.yaml,
    # matched on normalized board_vendor/board_name. A match only ever produces
    # a diagnose() finding quoting that entry's `note` -- it never triggers a
    # BIOS flash or anything else. See hardware.reboot in the Module Reference
    # for the file format.

  hardware_sleep:
    enabled: false
    # "s2idle", "deep", or "" (the default -- don't enforce). Most modern
    # desktops that support real S3 benefit from declaring "deep" over the more
    # power-hungry "s2idle"; check `cat /sys/power/mem_sleep` for what your
    # platform actually offers before declaring one -- not every board supports
    # both. Runtime-only: reverts to the kernel/firmware default on next boot
    # unless a mem_sleep_default= kernel parameter is also set (a bootloader
    # edit, out of scope here).
    desired_mem_sleep: ""

  hardware_rgb:
    # Only relevant if your motherboard has SMBus RGB headers you want OpenRGB
    # (or similar) to control -- most hosts leave this disabled. Declares and
    # loads the i2c-dev kernel module, the standard prerequisite for
    # /dev/i2c-* nodes to exist at all. No device/color/profile management;
    # see hardware.rgb in the Module Reference for why.
    enabled: false
