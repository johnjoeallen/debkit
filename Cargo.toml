[package]
name = "debkit"
version = "0.1.50"
edition = "2024"
license = "GPL-3.0-or-later"
description = "DebKit CLI"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
uuid = { version = "1", features = ["v4"] }

[package.metadata.deb]
name = "debkit"
maintainer = "John Allen <john@example.com>"
section = "utils"
priority = "optional"
depends = []
assets = [
    ["target/release/debkit", "usr/bin/debkit", "755"],
    ["README.md", "usr/share/doc/debkit/README.md", "644"],
    ["data/boards/registry.yaml", "usr/share/debkit/boards/registry.yaml", "644"],
    ["data/boards/registry.yaml", "etc/debkit/boards/registry.yaml", "644"],
    ["config.example.yaml", "etc/debkit/config.yaml", "644"],
]
conf-files = ["/etc/debkit/config.yaml", "/etc/debkit/boards/registry.yaml"]
